<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GI/Hep Staff Schedule</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <h1>GI/Hep Staff Schedule &amp; Vacation Calendar</h1>
      <div class="role">
        <div class="seg" id="roleSeg" role="group" aria-label="View as role">
          <button data-role="employee">Employee</button>
          <button data-role="charge">Charge nurse</button>
          <button data-role="manager">Manager</button>
        </div>
        <select id="meSelect" aria-label="Viewing as employee"></select>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="calendar">Vacation calendar</button>
      <button class="tab" data-view="schedule">Staff schedule</button>
      <button class="tab" data-view="requests"><span id="reqTabLabel">Requests</span> <span id="pendingBadge" class="badge" hidden></span></button>
      <button class="tab" data-view="staff" id="staffTab">Staff</button>
    </nav>
  </header>

  <main>
    <div class="banner">Prototype with demo data, saved in this browser only. Switch roles at the top to see each person's view.</div>

    <!-- Calendar -->
    <section id="view-calendar" class="view active">
      <div class="toolbar">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" aria-label="Next month">›</button>
        <button id="todayBtn" class="ghost">Today</button>
        <label class="inline">Min staff/day
          <input id="minStaff" type="number" min="0" max="200" />
        </label>
        <label class="inline"><input id="showPending" type="checkbox" checked /> Show pending</label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="cal-layout">
        <div>
          <div class="cal-head" id="calHead"></div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <aside class="day-panel" id="dayPanel"></aside>
      </div>
    </section>

    <!-- Spreadsheet schedule -->
    <section id="view-schedule" class="view">
      <div class="toolbar sheet-toolbar">
        <div class="seg" role="group" aria-label="Schedule mode">
          <button data-mode="week">Week</button>
          <button data-mode="template">Repeating pattern</button>
        </div>
        <span id="weekNav" class="week-nav">
          <button id="prevWeek" aria-label="Previous week">‹</button>
          <button id="thisWeek" class="ghost">This week</button>
          <button id="nextWeek" aria-label="Next week">›</button>
        </span>
        <strong id="weekLabel"></strong>
      </div>
      <div class="toolbar sheet-toolbar">
        <input id="sheetSearch" type="search" placeholder="Filter staff…" />
        <button class="ghost" id="toggleAll">Collapse all</button>
        <button class="ghost" id="resetWeek">Reset week to pattern</button>
        <button class="ghost" id="exportCsv">Export to Excel (CSV)</button>
      </div>
      <div class="formula-bar">
        <span id="nameBox" class="name-box"></span>
        <span class="fx-label">fx</span>
        <span id="fx" class="fx"></span>
        <span class="shift-btns" id="shiftBtns"></span>
      </div>
      <div class="sheet-wrap" id="sheet" tabindex="0"><table class="sheet" id="schedTable"></table></div>
      <p class="muted hint" id="sheetHint"></p>
    </section>

    <!-- Requests -->
    <section id="view-requests" class="view">
      <div id="notice" class="okmsg" hidden></div>

      <div id="empView">
        <form id="reqForm" class="card form-grid" novalidate>
          <h3>New time-off request <small class="muted" id="reqFor"></small></h3>
          <label>Leave type <select id="reqType"></select></label>
          <label>Start <input id="reqStart" type="date" /></label>
          <label>End <input id="reqEnd" type="date" /></label>
          <label>Shift
            <select id="reqShift"><option>Full Shift</option><option>Partial Shift</option></select>
          </label>
          <label id="partialWrap" hidden>Partial times (24-hour)
            <span class="times"><input id="reqT1" maxlength="4" inputmode="numeric" placeholder="0835" /> to
            <input id="reqT2" maxlength="4" inputmode="numeric" placeholder="1200" /></span>
          </label>
          <label class="wide">Note <input id="reqNote" type="text" placeholder="Optional" /></label>
          <div id="reqErrors" class="wide err" hidden></div>
          <div id="reqImpact" class="wide impact" hidden></div>
          <div class="wide"><button type="submit">Submit request</button></div>
        </form>
        <h3>My requests</h3>
        <div id="myReqs"></div>
      </div>

      <div id="reviewView">
        <h2 class="left" id="queueTitle"></h2>
        <div id="queue"></div>
        <div class="filter-row">
          <h3 class="inline-h">All requests</h3>
          <select id="reqFilter" aria-label="Filter requests">
            <option value="all">All</option><option value="Pending">Pending</option>
            <option value="Approved">Approved</option><option value="Partially">Partially approved</option>
            <option value="Denied">Denied</option>
          </select>
        </div>
        <div id="reqList" class="req-list"></div>
      </div>
    </section>

    <!-- Staff (manager) -->
    <section id="view-staff" class="view">
      <form id="staffForm" class="card form-grid">
        <h3>Add staff member</h3>
        <label>Name (Last, First) <input id="staffName" required placeholder="Doe, Sam" /></label>
        <label>Job title <input id="staffRole" placeholder="RN" /></label>
        <label>Department <select id="staffGroup"></select></label>
        <label>Annual PTO/vacation days <input id="staffAllow" type="number" min="0" value="15" /></label>
        <div class="wide"><button type="submit">Add</button></div>
      </form>
      <div id="staffList" class="staff-list"></div>
      <div class="card data-tools">
        <h3>Data</h3>
        <p class="muted">Everything is saved in this browser only (localStorage).</p>
        <button id="exportBtn" class="ghost">Export JSON</button>
        <label class="ghost file-btn">Import JSON <input id="importFile" type="file" accept="application/json" hidden /></label>
        <button id="resetBtn" class="danger">Reset to demo data</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

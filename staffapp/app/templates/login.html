{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in (prototype)</h1>
  <p class="muted">No passwords. Pick who you are; the role defaults to that person's role but can be overridden for testing.</p>
  <form method="post" action="/login" class="stack">
    <label>User
      <select name="user_id" required>
        {% for e in employees %}
          <option value="{{ e.id }}">{{ e.name }} — {{ e.title }} ({{ e.role }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Role
      <select name="role">
        <option value="">Use their own role</option>
        {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
